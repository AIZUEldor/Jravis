name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: jravis_test
          POSTGRES_USER: jravis
          POSTGRES_PASSWORD: jravis_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jravis -d jravis_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://jravis:jravis_test_password@localhost:5432/jravis_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
