services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: jravis
      POSTGRES_USER: jravis
      POSTGRES_PASSWORD: jravis_dev_password
    ports:
      - "5432:5432"
    volumes:
      - jravis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jravis -d jravis"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      NODE_ENV: production
      DATABASE_URL: postgresql://jravis:jravis_dev_password@postgres:5432/jravis
      DB_SSL: "false"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  jravis_postgres_data:
